services:
  postgres:
    image: postgres:16-alpine
    container_name: yaqin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: yaqin_db
    ports:
      - "5432:5432"
    volumes:
      - yaqin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yaqin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: yaqin_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/yaqin_db?schema=public
      JWT_SECRET: production-super-secret-jwt-key-minimum-32
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-fake_token}
      APP_URL: ${APP_URL:-http://localhost:5173}
      API_URL: ${API_URL:-http://localhost:4000}
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: yaqin_web
    restart: unless-stopped
    ports:
      - "5173:80"

  bot:
    build:
      context: .
      dockerfile: ./apps/bot/Dockerfile
    container_name: yaqin_bot
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-fake_token}
      API_URL: http://api:4000

  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile
    container_name: yaqin_admin
    restart: unless-stopped
    ports:
      - "5174:80"

volumes:
  yaqin_pgdata:
