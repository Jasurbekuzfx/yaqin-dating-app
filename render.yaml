services:
  # 1. Yaqin REST API & Socket.IO Backend Service
  - type: web
    name: yaqin-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run db:push && node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: yaqin-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: CORS_ORIGIN
        value: "*"

  # 2. Yaqin Telegram Bot Worker
  - type: worker
    name: yaqin-bot
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node apps/bot/dist/bot.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yaqin-postgres
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: WEBAPP_URL
        fromService:
          type: web
          name: yaqin-web
          property: url

  # 3. Yaqin Mini App Frontend (Static Site)
  - type: web
    name: yaqin-web
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: yaqin-api
          property: url

databases:
  - name: yaqin-postgres
    plan: free
    databaseName: yaqin_db
    user: yaqin_user
